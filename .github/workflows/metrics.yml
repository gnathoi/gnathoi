name: Metrics

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 2am UTC
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest 2026-03-30
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: gnathoi
          template: classic
          base: repositories
          config_timezone: Europe/London
          config_padding: 8px
          output_action: commit
          committer_branch: main
          filename: github-metrics.svg

          # Languages — deep scan with TUI-style progress bars
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_skipped: html, css, makefile, cmake, dockerfile, shell, batchfile

          # Isometric 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Notable contributions to external repos
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request
