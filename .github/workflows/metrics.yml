name: Metrics

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 2am UTC
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest 2026-03-30
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: gnathoi
          template: classic
          base: repositories
          config_timezone: Europe/London
          config_padding: 8px
          output_action: commit
          committer_branch: main
          filename: github-metrics.svg

          # Topics — starred topics as a word cloud
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24

          # Isometric 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

